<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner Inbox | French Vanilla</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="top"><a class="brand" href="index.html"><span>FRENCH VANILLA</span><small>OWNER INBOX</small></a></header>
<main class="owner"><p class="eyebrow dark">CUSTOMER INQUIRIES</p><h1>Quote request inbox</h1><p>Sign in with your existing owner account. Customer records are available only to authorized owners.</p>
<form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn gold" type="submit">Sign In</button></form>
<p id="status" role="status" aria-live="polite"></p><section id="inbox" hidden><div class="inbox-actions"><button id="refresh" class="btn gold">Refresh</button><button id="logout" class="btn">Sign Out</button></div><p>Latest 100 requests. This inbox supports review; automated FURY processing and customer replies are not enabled here.</p><div id="requests"></div></section></main><script type="module" src="owner.mjs"></script></body></html>
