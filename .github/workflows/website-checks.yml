name: Website checks

on:
  pull_request:
  push:
    branches:
      - main
      - 'build/**'
      - 'parker/**'

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website-checks:
    name: Assets, syntax and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check local assets and JavaScript syntax
        run: npm run check
      - name: Run website regression tests
        run: npm test
